

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_USER: postgres
    ports: "5432:5432"
  app:
    build: .
    ports: "8080:8080"
    depends_on: postgres
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres:5432/postgres
    restart: on-failure
