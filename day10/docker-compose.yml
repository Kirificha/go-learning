version: '3.8'

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: pass
    ports: 
      - "5432:5432"
  app:
      build: .
      ports:
      - "8080:8080"
      depends_on:
        - postgres
      environment: 
        DATABASE_URL: postgres://postgres:pass@postgres:5432/postgres
      restart: on-failure